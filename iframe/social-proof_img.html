<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 리뷰 배너 v6.0</title>
    <style>
        /* --- 기본 설정 --- */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box; }
        body {
            background-color: transparent; /* 이미지만 보여주기 위해 배경은 투명하게 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- [v6.0] 이미지를 담는 컨테이너 --- */
        .review-banner {
            opacity: 0; /* 처음엔 투명하게 */
            animation: none; /* 애니메이션 없음 */
            width: 100%;
            max-width: 450px; /* 이미지 최대 너비 설정 (원하는 크기로 조절) */
        }
        
        /* 애니메이션 재생 클래스 */
        .review-banner.playing {
            animation: fade-in-out 8s ease-in-out;
        }

        /* --- [v6.0] 리뷰 이미지 스타일 --- */
        .review-image {
            display: block; /* 이미지 아래 불필요한 여백 제거 */
            width: 100%;   /* 컨테이너 너비에 꽉 채우기 */
            height: auto;  /* 이미지 비율 유지 */
        }

        /* --- [v4.0] 페이드 인/아웃 애니메이션 (수정 없음) --- */
        @keyframes fade-in-out {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="review-banner">
        <img class="review-image" src="" alt="고객 리뷰">
    </div>

    <script>
        // --- [v6.0] 여기에 보여주고 싶은 이미지들의 전체 URL을 넣어주세요! ---
        const reviewImages = [
            'https://kfund.ai/img/review/리뷰1.png', // 예: https://storage.googleapis.com/my-bucket/review1.png
			'https://kfund.ai/img/review/리뷰2.png',
			'https://kfund.ai/img/review/리뷰3.png',
			'https://kfund.ai/img/review/리뷰4.png'
            // 이미지를 계속 추가할 수 있습니다.
        ];

        const reviewBanner = document.querySelector('.review-banner');
        const reviewImageEl = document.querySelector('.review-image');
        
        const ANIMATION_INTERVAL = 8000; // 8초

        function showRandomReview() {
            // 랜덤으로 이미지 하나를 선택
            const randomIndex = Math.floor(Math.random() * reviewImages.length);
            const selectedImageUrl = reviewImages[randomIndex];
            
            // img 태그의 src를 선택된 이미지 URL로 변경
            reviewImageEl.src = selectedImageUrl;
            
            // 애니메이션을 다시 시작하는 마법!
            reviewBanner.classList.remove('playing');
            void reviewBanner.offsetWidth; // 브라우저에게 변화를 인지시키는 트릭
            reviewBanner.classList.add('playing');
        }

        // [v6.0] 개선된 iframe 높이 조절
        // 이미지가 실제로 로드된 후에 정확한 높이를 부모 창에 전달합니다.
        reviewImageEl.onload = () => {
            const height = reviewImageEl.offsetHeight;
            if (height > 0) {
                // 이 배너를 사용하는 부모 페이지에 높이 정보를 전달합니다.
                parent.postMessage({ type: 'resize-iframe', height: height }, '*');
            }
        };

        // 페이지가 처음 로드될 때 실행
        window.onload = () => {
            showRandomReview(); // 첫 이미지 보여주기
            setInterval(showRandomReview, ANIMATION_INTERVAL); // 8초마다 반복
        };
    </script>
</body>
</html>
