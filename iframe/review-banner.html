<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마케팅 리뷰 배너 v1.4</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        body {
            background-color: transparent; 
            font-family: 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .review-banner {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 15px 20px;
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
        }
        .review-content {
            margin: 0;
            font-size: 16px;
            color: #333;
            animation: none;
            white-space: nowrap;
            display: inline-block;
            padding-left: 100%;
        }
        .review-content.playing {
            animation: scroll-left 10s linear infinite;
        }
        @keyframes scroll-left {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-200%); }
        }
    </style>
</head>
<body>

    <div class="review-banner">
        <p class="review-content"></p>
    </div>

    <script>
        const reviews = [
            "이 강의를 듣고 제 통장 잔고가 SEO 순위처럼 수직 상승했어요!",
            "A/B 테스트하다 인생까지 테스트할 뻔... 그래도 대표님 칭찬에 피로가 녹네요.",
            "광고 예산을 태웠더니, 고객들의 마음이 활활 타오르기 시작했습니다. 🔥",
            "GA4... 너란 녀석... 덕분에 데이터와 밀당하는 법을 배웠습니다.",
            "퍼포먼스 마케팅인 줄 알았는데, 제 지갑 퍼포먼스가 더 좋아졌네요! (텅장에서 뚱장으로)"
        ];

        const reviewContent = document.querySelector('.review-content');
        const reviewBanner = document.querySelector('.review-banner');

        function showRandomReview() {
            const randomIndex = Math.floor(Math.random() * reviews.length);
            reviewContent.textContent = reviews[randomIndex];
            reviewContent.classList.remove('playing');
            void reviewContent.offsetWidth; 
            reviewContent.classList.add('playing');
        }
        
        // ✨ [v1.5 디버깅] 자신의 높이를 부모 페이지로 전송하는 함수 (로그 추가)
		function sendHeightToParent() {
			// .review-banner 요소의 실제 렌더링 높이를 측정
			const height = reviewBanner.offsetHeight;
			
			// ✨ 이 로그가 보이는지 확인하는 것이 핵심입니다!
			console.log(`📢 review-banner: 높이 측정 완료 (${height}px). 부모에게 전송 시도...`);
			
			// 부모 창으로 메시지 전송
			parent.postMessage({ type: 'resize-iframe', height: height }, '*');
		}

        // 페이지 로딩 및 모든 리소스(폰트 등) 로딩이 끝나면 높이 전송
        window.onload = () => {
            showRandomReview();
            setInterval(showRandomReview, 10000);
            
            // 높이를 한 번 보내고, 혹시 모를 변화에 대비해 약간의 시간차를 두고 한 번 더 보냄
            sendHeightToParent();
            setTimeout(sendHeightToParent, 500);
        };
    </script>

</body>
</html>
