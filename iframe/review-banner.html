<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마케팅 리뷰 배너 v2.0</title>
    <style>
        /* --- 기본 설정 --- */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body { 
            background-color: transparent; 
            font-family: 'Pretendard', 'Helvetica Neue', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        /* --- [v2.0] 배너 디자인 --- */
        .review-banner {
            background-color: #111827; /* 어두운 남색 계열 배경 */
            border-radius: 12px;
            padding: 20px 25px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden; /* 그라데이션 효과를 위해 중요 */
            color: #E5E7EB; /* 밝은 회색 텍스트 */
        }
        
        /* --- [v2.0] 그라데이션 테두리 효과 --- */
        .review-banner::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -2px; /* 테두리 두께 */
            border-radius: inherit; /* 부모의 둥근 모서리 상속 */
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc); /* 하늘색-보라색 그라데이션 */
        }

        /* --- [v2.0] 리뷰 컨텐츠 컨테이너 --- */
        .review-container {
            display: flex;
            align-items: flex-start;
            height: 2.4em; /* 2줄 분량의 높이 고정 (줄바꿈 방지) */
            line-height: 1.2em;
            overflow: hidden; /* 애니메이션을 위해 중요 */
        }
        
        /* --- [v2.0] 인용 부호 아이콘 --- */
        .quote-icon {
            font-size: 28px;
            font-weight: bold;
            color: #6366F1; /* 포인트 색상 */
            margin-right: 10px;
            line-height: 1;
        }

        /* --- [v2.0] 슬라이드 업 애니메이션을 위한 텍스트 래퍼 --- */
        .review-text-wrapper {
            position: relative;
            flex-grow: 1;
            height: 100%;
        }

        .review-content {
            margin: 0;
            font-size: 16px;
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateY(100%);
            animation: none;
        }

        .review-content.playing {
            animation: slide-up 10s ease-in-out;
        }

        /* --- [v2.0] 슬라이드 업 키프레임 --- */
        @keyframes slide-up {
            0% { transform: translateY(100%); opacity: 0; }
            15% { transform: translateY(0); opacity: 1; } /* 나타나기 */
            85% { transform: translateY(0); opacity: 1; } /* 유지 */
            100% { transform: translateY(-100%); opacity: 0; } /* 사라지기 */
        }
    </style>
</head>
<body>
    <div class="review-banner">
        <div class="review-container">
            <span class="quote-icon">“</span>
            <div class="review-text-wrapper">
                <p class="review-content"></p>
            </div>
        </div>
    </div>
    <script>
        const reviews = [
            "이 강의를 듣고 제 통장 잔고가 SEO 순위처럼 수직 상승했어요!",
            "A/B 테스트하다 인생까지 테스트할 뻔... 그래도 대표님 칭찬에 피로가 녹네요.",
            "광고 예산을 태웠더니, 고객들의 마음이 활활 타오르기 시작했습니다. 🔥",
            "GA4... 너란 녀석... 덕분에 데이터와 밀당하는 법을 배웠습니다.",
            "퍼포먼스 마케팅인 줄 알았는데, 제 지갑 퍼포먼스가 더 좋아졌네요! (텅장에서 뚱장으로)"
        ];
        const reviewContent = document.querySelector('.review-content');
        const reviewBanner = document.querySelector('.review-banner');

        function showRandomReview() {
            const randomIndex = Math.floor(Math.random() * reviews.length);
            reviewContent.textContent = reviews[randomIndex];
            
            // 애니메이션 재시작
            reviewContent.classList.remove('playing');
            void reviewContent.offsetWidth; // 리플로우 강제
            reviewContent.classList.add('playing');
        }

        // --- 기존 로직 (수정 없음) ---
        window.onload = () => {
            showRandomReview();
            // 애니메이션 주기에 맞춰 10초마다 리뷰 변경
            setInterval(showRandomReview, 10000);

            let attempts = 0;
            const intervalId = setInterval(() => {
                const height = reviewBanner.offsetHeight;
                if (height > 0) {
                    parent.postMessage({ type: 'resize-iframe', height: height }, '*');
                }
                attempts++;
                if (attempts > 25) { 
                    clearInterval(intervalId);
                }
            }, 200);
        };
    </script>
</body>
</html>
