<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마케팅 리뷰 배너 v3.0</title>
    <style>
        /* --- 기본 설정 --- */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body { 
            background-color: transparent; 
            font-family: 'Pretendard', 'Helvetica Neue', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 0 1rem; /* 좌우 여백 추가 */
            box-sizing: border-box;
        }

        /* --- [v3.0] 배너 디자인 (애니메이션 주체로 변경) --- */
        .review-banner {
            background-color: #111827;
            border-radius: 12px;
            padding: 20px 25px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            color: #E5E7EB;
            /* 애니메이션 초기 상태 */
            opacity: 0;
            animation: none;
        }
        
        /* [v3.0] 애니메이션 재생을 위한 클래스 */
        .review-banner.playing {
            animation: fade-in-out 10s ease-in-out;
        }

        .review-container {
            display: flex;
            align-items: flex-start;
        }
        
        .quote-icon {
            font-size: 28px; font-weight: bold; color: #6366F1;
            margin-right: 10px; line-height: 1;
        }

        .review-text-wrapper {
            flex-grow: 1;
			min-width: 0; /* 줄바꿈을 위해 유지 */
        }
        
        /* --- [v3.0] 텍스트 스타일 (position: absolute 제거) --- */
        .review-content {
            margin: 0;
            font-size: 16px;
            line-height: 1.6; /* 줄 간격 추가로 가독성 확보 */
            word-break: keep-all; /* 단어 단위로 줄바꿈 */
        }

        /* --- [v3.0] 페이드 인/아웃 애니메이션 --- */
        @keyframes fade-in-out {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="review-banner">
        <div class="review-container">
            <span class="quote-icon">“</span>
            <div class="review-text-wrapper">
                <p class="review-content"></p>
            </div>
        </div>
    </div>
    <script>
        const reviews = [
			"다른 대행사에서는 예산을 늘리자는 말뿐이었는데, 여기는 전략으로 승부하더군요. 작은 예산으로도 이렇게 큰 효과를... 신기합니다.", 
			"절반도 안 되는 비용으로 매출의 3배를 만들어냈습니다. 솔직히 충격적이었어요. 앞으로 잘 부탁드립니다.", 
			"광고비만 축내던 지난 대행사들과는 차원이 다릅니다. ROAS 450% 효율 마케팅 이제야 제대로 찾았네요!!",
			"다른데는 돈만 쓰고 끝나지만, 여기는 광고비 한 푼 한 푼을 칼같이 성과로 바꿔줍니다! 가성비 끝판왕이에요~"
        ];
        const reviewContent = document.querySelector('.review-content');
        const reviewBanner = document.querySelector('.review-banner');

        function showRandomReview() {
            const randomIndex = Math.floor(Math.random() * reviews.length);
            reviewContent.textContent = reviews[randomIndex];
            
            // [v3.0] 애니메이션 대상을 .review-banner로 변경
            reviewBanner.classList.remove('playing');
            void reviewBanner.offsetWidth; // 리플로우 강제
            reviewBanner.classList.add('playing');

            // [v3.0] 높이 전달 로직 개선: 내용 변경 후 잠시 뒤에 높이 계산
            setTimeout(() => {
                const height = reviewBanner.offsetHeight;
                if (height > 0) {
                    parent.postMessage({ type: 'resize-iframe', height: height }, '*');
                }
            }, 100); // 0.1초 뒤 실행하여 정확도 높임
        }

        window.onload = () => {
            showRandomReview();
            setInterval(showRandomReview, 10000); // 10초마다 리뷰 변경
        };
    </script>
</body>
</html>
