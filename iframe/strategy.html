<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광고비, 왜 더 내세요? - 전략 마케팅</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* 기본 설정 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 스크롤 방지 */
            background-color: #000; /* 전체 배경을 검은색으로 */
            font-family: 'Noto Sans KR', sans-serif;
            color: #fff;
            box-sizing: border-box;
        }

        .page-container {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
			justify-content: center;
            padding: 50px 30px;
            box-sizing: border-box;
            text-align: center;
			/* ✨ 추가 제안 ✨ */
			max-width: 1200px; /* 콘텐츠 영역의 최대 너비를 1200px로 제한 */
			margin: 0 auto;    /* 화면이 더 클 경우, 컨테이너를 중앙에 배치 */
        }

        .top-section, .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 상단 텍스트 스타일 */
        .top-section h1 {
            font-size: clamp(42px, 7vw, 85px); /* [수정됨] 폰트 비율 조정 */
            font-weight: 900;
            line-height: 1.2;
            margin: 0 0 20px 0;
            word-break: keep-all;
        }
        .top-section p {
            font-size: clamp(14px, 1.5vw, 18px); /* [수정됨] 폰트 비율 조정 */
            font-weight: 400;
            line-height: 1.5;
            margin: 0;
            color: #ccc;
            word-break: keep-all;
        }

        /* 하단 텍스트 스타일 */
        .bottom-section h1 {
            font-size: clamp(38px, 6vw, 75px); /* [수정됨] 폰트 비율 조정 */
            font-weight: 900;
            line-height: 1.3;
            margin: 0 0 20px 0;
            word-break: keep-all;
        }
        .bottom-section h1 .highlight {
            color: #F00;
        }
        .bottom-section p {
            font-size: clamp(13px, 1.4vw, 16px); /* [수정됨] 폰트 비율 조정 */
            font-weight: 400;
            line-height: 1.5;
            margin: 0;
            color: #ccc;
            word-break: keep-all;
        }
        .bottom-section p strong {
            font-weight: 700;
            color: #fff;
        }

        /* ================================== */
        /* ✨ 추천 효과 모두 적용 ✨ */
        /* ================================== */

        /* --- 추천 1: 등장 애니메이션 효과 --- */
        @keyframes fade-slide-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-section h1, .top-section p,
        .bottom-section h1, .bottom-section p {
            opacity: 0;
            animation: fade-slide-up 0.8s ease-out forwards;
        }

        .top-section p { animation-delay: 0.2s; }
        .bottom-section h1 { animation-delay: 0.4s; }
        .bottom-section p { animation-delay: 0.6s; }

        /* --- 추천 2: 그라데이션 텍스트 효과 (상단 h1에만 적용) --- */
        .top-section h1 {
            background: linear-gradient(to bottom, #ffffff, #bbbbbb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* --- 추천 3: 글로우 효과 --- */
        @keyframes pulse-glow {
            0%, 100% {
                text-shadow: 0 0 5px rgba(255, 0, 0, 0.7), 0 0 10px rgba(255, 0, 0, 0.5);
            }
            50% {
                text-shadow: 0 0 15px rgba(255, 0, 0, 0.9), 0 0 30px rgba(255, 0, 0, 0.7);
            }
        }

        .bottom-section h1 .highlight {
            color: #FF4D4D;
            animation: pulse-glow 2.5s infinite ease-in-out;
        }
		
		/* ================================== */
		/* ✨ PC 모드 전용 폰트 크기 ✨ */
		/* ================================== */
		@media (min-width: 1024px) {
			/* 화면 너비가 1024px 이상일 때 아래 스타일이 적용됩니다. */

			.top-section h1 {
				font-size: clamp(85px, 8vw, 110px); /* 최대 크기를 110px까지 대폭 상향 */
			}
			.top-section p {
				font-size: clamp(18px, 1.5vw, 22px);
			}
			.bottom-section h1 {
				font-size: clamp(75px, 7vw, 95px); /* 최대 크기를 95px까지 대폭 상향 */
			}
			.bottom-section p {
				font-size: clamp(16px, 1.5vw, 20px);
			}
		}
    </style>
</head>
<body>
    <div class="page-container">
        <div class="top-section">
            <h1>광고비,<br>왜 더 내세요?</h1>
            <p>적게쓰고,<br>제대로 통하는 마케팅</p><br><br><br><br>
        </div>

        <div class="bottom-section">
            <h1>돈을 더 쓰지 말고,<br><span class="highlight">전략</span>을 더하세요!</h1>
            <p>전략을 바꾸고 <strong>매출 성장</strong>을 이룬 고객사</p>
        </div>
    </div>
</body>
</html>
