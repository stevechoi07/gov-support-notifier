<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 상세 페이지 미리보기</title>
    <style>
        /* 기본 리셋 */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* 배경은 살짝 회색으로 처리하여 콘텐츠 집중 */
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 컨테이너 스타일 - 중앙 정렬 및 그림자 효과 */
        .page-container {
            max-width: 860px; /* 이미지의 max-width와 맞춤 */
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            min-height: 100vh;
        }

        /* 헤더 (선택 사항 - 필요 없으면 제거 가능) */
        header {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: #fff;
        }
        header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 간단한 헤더 (미리보기용) -->
    <header>
        <h1>Product Detail View</h1>
    </header>

    <div class="page-container">
        <!-- 요청하신 코드 시작 -->
        <div style="max-width:860px; margin:0 auto; padding:0; font-size:0; line-height:0; text-align:center;">
            <div><img src="https://488966.geditorimage.co.kr/geditor_files/deployments/deployment_46832/geditor_product_1.png" alt="" style="max-width:100%"></div>
            <div><img src="https://488966.geditorimage.co.kr/geditor_files/deployments/deployment_46832/geditor_product_2.png" alt="" style="max-width:100%"></div>
        </div>
        <!-- 요청하신 코드 끝 -->
    </div>

</body>
</html>
