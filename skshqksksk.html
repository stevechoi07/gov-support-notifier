                                    NanoBanana Prompts <span className="text-xs bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full ml-1">Ver 1.3</span>
                                </h1>
                                <p className="text-xs text-slate-500 mt-1">입체퍼즐 상세페이지용 AI 이미지 생성 도우미</p>
                            </div>
                            <button 
                                onClick={() => setShowMarkdown(true)}
                                className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition text-sm font-medium"
                            >
                                <IconFileText size={16} />
                                Markdown 전체 복사
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-4xl mx-auto px-4 py-8">
                        
                        {/* Tabs */}
                        <div className="flex gap-2 mb-6 bg-slate-200 p-1 rounded-lg w-fit">
                            <button 
                                onClick={() => setActiveTab("Atmosphere")}
                                className={`px-4 py-2 rounded-md text-sm font-medium transition ${activeTab === "Atmosphere" ? "bg-white text-indigo-600 shadow-sm" : "text-slate-600 hover:text-slate-900"}`}
                            >
                                🎨 배경/연출 (Atmosphere)
                            </button>
                            <button 
                                onClick={() => setActiveTab("Detail")}
                                className={`px-4 py-2 rounded-md text-sm font-medium transition ${activeTab === "Detail" ? "bg-white text-indigo-600 shadow-sm" : "text-slate-600 hover:text-slate-900"}`}
                            >
                                🔍 디테일/질감 (Detail)
                            </button>
                        </div>

                        {/* Tip Box */}
                        <div className="bg-indigo-50 border border-indigo-100 rounded-lg p-4 mb-8 flex gap-3 text-sm text-indigo-800">
                            <div className="mt-1"><IconCamera size={18} /></div>
                            <div>
                                <strong className="block font-semibold mb-1">나노바나나 사용 꿀팁</strong>
                                프롬프트의 'angle' 설명과 <strong>비슷한 각도로 찍은 제품 사진</strong>을 넣어야 결과물이 자연스럽습니다. 
                                프롬프트 내의 <code>[3D puzzle model]</code> 부분은 수정하지 않아도 되지만, 필요하다면 제품명(예: Janganmun Gate)으로 바꿔주세요.
                            </div>
                        </div>

                        {/* Cards Grid */}
                        <div className="grid gap-6">
                            {activePrompts.map((item) => (
                                <div key={item.id} className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition duration-300">
                                    <div className="p-5">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex items-center gap-2">
                                                <div className={`p-2 rounded-lg ${item.id > 10 ? 'bg-yellow-100 text-yellow-700' : 'bg-indigo-50 text-indigo-600'}`}>
                                                    {item.icon}
                                                </div>
                                                <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                                    {item.title}
                                                    {item.id > 10 && <span className="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full uppercase tracking-wider font-bold">New</span>}
                                                </h3>
                                            </div>
                                            <span className={`text-xs px-2 py-1 rounded font-medium ${item.category === 'Atmosphere' ? 'bg-green-100 text-green-700' : 'bg-purple-100 text-purple-700'}`}>
                                                {item.category}
                                            </span>
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-4 mb-4">
                                            <div className="flex-1 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                                <div className="text-xs font-bold text-slate-400 uppercase mb-1 flex items-center gap-1">
                                                    <IconCamera size={12} /> 추천 입력 각도
                                                </div>
                                                <div className="font-medium text-slate-700 text-sm">{item.angle}</div>
                                                <div className="text-xs text-slate-500 mt-1">{item.angleDesc}</div>
                                            </div>
                                            <div className={`flex-1 p-3 rounded-lg border ${item.id > 10 ? 'bg-yellow-50 border-yellow-100' : 'bg-slate-50 border-slate-100'}`}>
                                                 <div className="text-xs font-bold text-slate-400 uppercase mb-1 flex items-center gap-1">
                                                    <IconSun size={12} /> 분위기 / 특징
                                                </div>
                                                <div className="text-sm text-slate-600 leading-relaxed">{item.korean}</div>
                                            </div>
                                        </div>

                                        <div className="relative group">
                                            <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button 
                                                    onClick={() => handleCopy(item.english, item.id)}
                                                    className={`flex items-center gap-1 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm ${copiedId === item.id ? 'bg-green-500 text-white' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200'}`}
                                                >
                                                    {copiedId === item.id ? <IconCheck size={14} /> : <IconCopy size={14} />}
                                                    {copiedId === item.id ? "복사됨!" : "프롬프트 복사"}
                                                </button>
                                            </div>
                                            <pre className="bg-slate-800 text-slate-100 p-4 rounded-lg text-sm overflow-x-auto whitespace-pre-wrap font-mono leading-relaxed border border-slate-700">
                                                {item.english}
                                            </pre>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Markdown Modal */}
                    {showMarkdown && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[80vh] flex flex-col">
                                <div className="p-4 border-b border-slate-200 flex justify-between items-center">
                                    <h2 className="font-bold text-lg">Markdown 전체 코드</h2>
                                    <button onClick={() => setShowMarkdown(false)} className="text-slate-400 hover:text-slate-600">
                                        <IconX size={24} />
                                    </button>
                                </div>
                                <div className="p-4 overflow-y-auto flex-1 bg-slate-50">
                                    <pre className="text-xs sm:text-sm font-mono whitespace-pre-wrap text-slate-700 select-all">
                                        {generateMarkdown()}
                                    </pre>
                                </div>
                                <div className="p-4 border-t border-slate-200 flex justify-end gap-2 bg-white rounded-b-xl">
                                    <button 
                                        onClick={() => setShowMarkdown(false)}
                                        className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium"
                                    >
                                        닫기
                                    </button>
                                    <button 
                                        onClick={() => handleCopy(generateMarkdown(), 'all')}
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium flex items-center gap-2"
                                    >
                                        {copiedId === 'all' ? <IconCheck size={16} /> : <IconCopy size={16} />}
                                        {copiedId === 'all' ? "복사 완료!" : "전체 복사하기"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
